<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вертолет Кликер ONLINE PRO</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        /* [ВСЁ ЗАМОРОЖЕНО: СТИЛИ, ПОЗИЦИИ] */
        body { margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #000000, #0f0c29, #302b63, #000000); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        #ban-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #ff4444; }
        #player-id-display { position: absolute; top: 85px; right: 15px; font-size: 10px; background: rgba(255, 255, 255, 0.05); padding: 5px 10px; border-radius: 5px; color: rgba(255, 255, 255, 0.4); letter-spacing: 1px; z-index: 5; border: 1px solid rgba(255, 255, 255, 0.1); }
        nav { display: flex; justify-content: center; gap: 10px; padding: 20px; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(10px); z-index: 10; }
        .nav-btn { padding: 10px 25px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(255, 255, 255, 0.1); color: white; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { background: #ffd700; color: black; font-weight: bold; }
        #admin-btn { display: none; border: 1px solid #ff4444; }
        .tab-content { display: none; flex-direction: column; align-items: center; justify-content: flex-start; flex-grow: 1; padding: 20px; }
        #clicker-tab { padding-top: 60px; }
        .tab-content.active { display: flex; }
        #balance-container { font-size: 38px; font-weight: 800; margin-bottom: 30px; padding: 10px 30px; background: rgba(255, 255, 255, 0.1); border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.2); }
        #clicker-image { width: 85%; max-width: 500px; border-radius: 20px; box-shadow: 0 0 30px rgba(255, 0, 0, 0.15); transition: transform 0.1s; touch-action: manipulation; }
        #clicker-image:active { transform: scale(0.92); }

        #nick-display-btn { margin-top: 25px; padding: 10px 20px; background: rgba(255, 215, 0, 0.1); border: 1px solid #ffd700; color: #ffd700; border-radius: 10px; font-size: 14px; cursor: pointer; transition: 0.3s; }
        
        /* ТЭГ ТОЛЬКО ДЛЯ АДМИНОВ (Изначально скрыт) */
        #modded-tag { display: none; color: #ff4444; font-size: 12px; font-weight: bold; margin-top: 8px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(255, 68, 68, 0.5); font-family: monospace; }

        .shop-item { width: 100%; max-width: 400px; background: rgba(255, 255, 255, 0.1); margin: 10px 0; padding: 20px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; }
        .buy-btn { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s ease; }
        .overlay.show { display: flex; opacity: 1; }
        .modal-content { background: rgba(40, 40, 60, 0.95); padding: 30px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.2); text-align: center; transform: scale(0.8); transition: transform 0.3s ease; }
        .overlay.show .modal-content { transform: scale(1); }
        
        .admin-input-field { width: 90%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #555; background: #111; color: white; text-align: center; font-size: 16px; }
        .admin-box { background: rgba(255, 0, 0, 0.15); padding: 20px; border-radius: 20px; border: 1px solid #ff4444; text-align: center; width: 90%; max-width: 350px; }
        .admin-action { background: #ff4444; color: white; border: none; padding: 12px; margin: 5px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; }
        
        .plus-one { position: absolute; color: #ffd700; font-weight: bold; font-size: 30px; pointer-events: none; animation: floatUp 0.6s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-100px); } }
    </style>
</head>
<body>

    <div id="ban-screen">
        <h1 style="font-size: 40px;">BANNED</h1>
        <p>Ваш доступ заблокирован администратором.</p>
        <p id="banned-id-info" style="color: gray; font-size: 12px;"></p>
    </div>

    <div id="player-id-display">PILOT_ID: <span id="uid-value">...</span></div>

    <div id="modal-nick" class="overlay">
        <div class="modal-content">
            <h3 style="margin-top:0;">Ваш позывной</h3>
            <input type="text" id="nick-input" class="admin-input-field" placeholder="Введите ник..." maxlength="15">
            <br>
            <button onclick="saveNickname()" style="background:#ffd700; color:black; padding:12px 25px; border:none; border-radius:10px; font-weight:bold; cursor:pointer;">СОХРАНИТЬ</button>
            <button onclick="closeNickModal()" style="background:none; color:#aaa; border:none; margin-top:15px; cursor:pointer; display:block; width:100%;">Закрыть</button>
        </div>
    </div>

    <div id="modal-admin" class="overlay">
        <div class="modal-content">
            <h3>Выдача монет</h3>
            <input type="number" id="admin-input" class="admin-input-field">
            <br>
            <button onclick="confirmAdminAdd()" style="background:#28a745; color:white; padding:10px 20px; border:none; border-radius:10px;">ОК</button>
            <button onclick="closeModals()" style="background:#555; color:white; padding:10px 20px; border:none; border-radius:10px;">Отмена</button>
        </div>
    </div>

    <nav>
        <button class="nav-btn active" onclick="openTab('clicker-tab', this)">Кликер</button>
        <button class="nav-btn" onclick="openTab('shop-tab', this)">Прокачка</button>
        <button class="nav-btn" id="admin-btn" onclick="openTab('admin-tab', this)">Админка</button>
    </nav>

    <div id="clicker-tab" class="tab-content active">
        <div id="balance-container"><span id="coins">0</span> 🪙</div>
        <img src="image.png" alt="Clicker" id="clicker-image">
        <button id="nick-display-btn" onclick="openNickModal()">НИКНЕЙМ: <span id="current-nick">Пилот</span></button>
        <div id="modded-tag">modded</div>
    </div>

    <div id="shop-tab" class="tab-content">
        <h2 style="margin-top: 40px;">Магазин</h2>
        <div class="shop-item"><div><h3>Клик +1</h3><p>Цена: <span id="click-price">10</span></p></div><button class="buy-btn" onclick="buyUpgrade('click')">Купить</button></div>
        <div class="shop-item"><div><h3>Авто 1/с</h3><p>Цена: <span id="auto-price">50</span></p></div><button class="buy-btn" onclick="buyUpgrade('auto')">Купить</button></div>
    </div>

    <div id="admin-tab" class="tab-content">
        <div class="admin-box" style="margin-top: 40px;">
            <h3 style="color:#ff4444; margin:0 0 15px 0;">УПРАВЛЕНИЕ БАНАМИ</h3>
            <input type="text" id="ban-target-id" class="admin-input-field" placeholder="Введите ID игрока">
            <button class="admin-action" onclick="adminBanPlayer()">ЗАБАНИТЬ ИГРОКА</button>
            <button class="admin-action" style="background:#28a745;" onclick="adminUnbanPlayer()">РАЗБАНИТЬ</button>
            <hr style="border: 0.5px solid #333; margin: 15px 0;">
            <button class="admin-action" style="background:#555;" onclick="showAdminModal()">ВЫДАТЬ МОНЕТЫ СЕБЕ</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDONq9oNGkDTfuN3dP02VJH-...", 
            authDomain: "fedyadaunclicker.firebaseapp.com",
            projectId: "fedyadaunclicker",
            storageBucket: "fedyadaunclicker.appspot.com",
            messagingSenderId: "467420726390",
            appId: "1:467420726390:web:cb16192884...",
            databaseURL: "https://fedyadaunclicker-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const ADMIN_IDS = ["ID-RLJV-KV0M", "ID-JILD-9NAM"];
        let coins = 0, clickPower = 1, autoClickers = 0, clickPrice = 10, autoPrice = 50, playerUID = "", nickname = "Пилот";

        function init() {
            playerUID = localStorage.getItem('playerUID') || 'ID-' + Math.random().toString(36).substr(2, 4).toUpperCase() + '-' + Math.random().toString(36).substr(2, 4).toUpperCase();
            localStorage.setItem('playerUID', playerUID);
            document.getElementById('uid-value').innerText = playerUID;
            const currentID = playerUID.toUpperCase();

            db.ref('banned/' + currentID).on('value', (snap) => {
                if (snap.val() === true) {
                    document.getElementById('ban-screen').style.display = 'flex';
                    document.getElementById('banned-id-info').innerText = "ID: " + currentID;
                }
            });

            // ПРОВЕРКА НА АДМИНА ДЛЯ ТЭГА И КНОПКИ
            if (ADMIN_IDS.includes(currentID)) { 
                document.getElementById('admin-btn').style.display = 'block'; 
                document.getElementById('modded-tag').style.display = 'block'; // Показываем тэг только тебе
            }

            db.ref('players/' + playerUID).on('value', (snap) => {
                const d = snap.val();
                if (d) {
                    coins = d.coins || 0; clickPower = d.clickPower || 1;
                    clickPrice = d.clickPrice || 10; autoClickers = d.autoClickers || 0;
                    autoPrice = d.autoPrice || 50; nickname = d.nickname || "Пилот";
                    updateUI();
                } else { saveToCloud(); }
            });
        }

        function saveToCloud() {
            db.ref('players/' + playerUID).set({ coins, clickPower, clickPrice, autoClickers, autoPrice, nickname });
        }

        function updateUI() {
            document.getElementById('coins').innerText = Math.floor(coins).toLocaleString();
            document.getElementById('click-price').innerText = clickPrice;
            document.getElementById('auto-price').innerText = autoPrice;
            document.getElementById('current-nick').innerText = nickname;
        }

        function openNickModal() { document.getElementById('modal-nick').classList.add('show'); }
        function closeNickModal() { document.getElementById('modal-nick').classList.remove('show'); }
        function saveNickname() {
            const val = document.getElementById('nick-input').value.trim();
            if (val) { nickname = val; updateUI(); saveToCloud(); closeNickModal(); }
        }

        document.getElementById('clicker-image').addEventListener('pointerdown', (e) => {
            coins += clickPower; updateUI(); saveToCloud();
            createPlusOne(e.clientX, e.clientY, clickPower);
            if (window.navigator.vibrate) window.navigator.vibrate(10);
        });

        function buyUpgrade(type) {
            if (type === 'click' && coins >= clickPrice) { coins -= clickPrice; clickPower++; clickPrice = Math.round(clickPrice * 1.6); }
            if (type === 'auto' && coins >= autoPrice) { coins -= autoPrice; autoClickers++; autoPrice = Math.round(autoPrice * 1.8); }
            saveToCloud();
        }

        function openTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function adminBanPlayer() {
            const target = document.getElementById('ban-target-id').value.trim().toUpperCase();
            if (target) { db.ref('banned/' + target).set(true); alert('Игрок ' + target + ' забанен!'); }
        }
        function adminUnbanPlayer() {
            const target = document.getElementById('ban-target-id').value.trim().toUpperCase();
            if (target) { db.ref('banned/' + target).remove(); alert('Игрок ' + target + ' разбанен!'); }
        }
        function showAdminModal() { document.getElementById('modal-admin').classList.add('show'); }
        function closeModals() { document.getElementById('modal-admin').classList.remove('show'); }
        function confirmAdminAdd() {
            const val = parseInt(document.getElementById('admin-input').value);
            if (!isNaN(val)) { coins += val; saveToCloud(); closeModals(); }
        }

        setInterval(() => { if (autoClickers > 0) { coins += autoClickers; updateUI(); saveToCloud(); } }, 1000);

        function createPlusOne(x, y, val) {
            const p = document.createElement('div'); p.innerText = '+' + val; p.className = 'plus-one';
            p.style.left = x + 'px'; p.style.top = y + 'px'; document.body.appendChild(p);
            setTimeout(() => p.remove(), 600);
        }

        window.onload = init;
    </script>
</body>
</html>
